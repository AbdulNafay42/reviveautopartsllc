<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Down</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: #ffffff;
      padding: 50px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fee2e2;
      font-size: 38px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 30px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #dc2626;
      border-radius: 50%;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .button:hover {
      background: #374151;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">
      ⚠️
    </div>

    <div class="status">
      <span class="dot"></span>
      Server Offline
    </div>

    <h1>Something went wrong</h1>

    <p>
      Our server is currently unavailable.
      We're working to get everything back online.
      Please try again in a few minutes.
    </p>

    <a  class="button">
      Try Again
    </a>

    <div class="footer">
      Error Code: 503 · Service Unavailable
    </div>

  </div>

</body>
</html>
